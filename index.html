<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Mileage</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    margin: 0;
    background: #f5f7fa;
    color: #222;
}
header {
    background: #0078d4;
    color: white;
    padding: 16px;
    text-align: center;
    position: relative;
}
header h1 { margin: 0 0 4px 0; }
#currentUserBadge {
    font-size: 13px;
    opacity: 0.85;
}
#switchUserBtn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
}
h2 { margin: 0 0 12px 0; }

/* Profile screen */
#profileScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    padding: 24px;
}
#profileScreen h2 { font-size: 22px; margin-bottom: 8px; }
#profileScreen p { color: #666; margin-bottom: 20px; text-align: center; }
.profile-list { width: 100%; max-width: 360px; margin-bottom: 16px; }
.profile-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    background: white;
    border: 2px solid #0078d4;
    border-radius: 10px;
    font-size: 17px;
    color: #0078d4;
    cursor: pointer;
    text-align: left;
}
.profile-btn:active { background: #e8f1fb; }
.new-profile-row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 360px;
}
.new-profile-row input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}
.new-profile-row button {
    padding: 12px 18px;
    background: #0078d4;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

/* Main app */
#appScreen { display: none; }
.card {
    background: white;
    margin: 16px;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
label {
    margin-top: 12px;
    display: block;
    font-weight: 600;
    font-size: 14px;
}
input[type=text], input[type=date], input[type=number], select {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}
button.primary {
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    background: #0078d4;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}
button.primary:active { opacity: 0.8; }
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
td, th {
    padding: 8px;
    border-bottom: 1px solid #eee;
    text-align: left;
}
footer {
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: #666;
}
</style>
</head>
<body>

<header>
    <h1>Business Mileage</h1>
    <div id="currentUserBadge"></div>
    <button id="switchUserBtn" style="display:none">Switch user</button>
</header>

<!-- Profile selection screen -->
<div id="profileScreen">
    <h2>Who are you?</h2>
    <p>Select your name or add a new profile.</p>
    <div class="profile-list" id="profileList"></div>
    <div class="new-profile-row">
        <input type="text" id="newProfileName" placeholder="Add new name…" maxlength="40">
        <button id="addProfileBtn">Add</button>
    </div>
</div>

<!-- Main app screen -->
<div id="appScreen">
    <section class="card">
        <h2>Add journey</h2>
        <label>Date</label>
        <input type="date" id="date">
        <label>From</label>
        <input type="text" id="from">
        <label>To</label>
        <input type="text" id="to">
        <label>Business purpose</label>
        <input type="text" id="purpose">
        <label>Miles</label>
        <input type="number" id="miles" step="0.1">
        <label>Vehicle registration</label>
        <input type="text" id="vehicle">
        <label>Rate (£/mile)</label>
        <input type="number" id="rate" step="0.01" value="0.45">
        <button id="add" class="primary">Add journey</button>
    </section>

    <section class="card">
        <h2>Journeys</h2>
        <table id="logTable">
            <thead>
                <tr>
                    <th>Date</th><th>From</th><th>To</th><th>Miles</th><th>Amount</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="card">
        <h2>Export</h2>
        <p>Select a tax year and export a CSV.</p>
        <label>Tax year</label>
        <select id="taxYearSelect"></select>
        <button id="exportYear" class="primary">Export selected tax year CSV</button>
    </section>

    <footer><small>Data stored locally on this device.</small></footer>
</div>

<script>
// ── State ──────────────────────────────────────────────
let db;
let currentUser = null;
let entriesCache = [];

// ── Profiles stored in localStorage ───────────────────
function getProfiles() {
    try { return JSON.parse(localStorage.getItem("mileage_profiles") || "[]"); }
    catch { return []; }
}
function saveProfiles(profiles) {
    localStorage.setItem("mileage_profiles", JSON.stringify(profiles));
}
function getLastUser() {
    return localStorage.getItem("mileage_last_user") || null;
}
function setLastUser(name) {
    localStorage.setItem("mileage_last_user", name);
}

// ── IndexedDB ──────────────────────────────────────────
function openDB(callback) {
    const req = indexedDB.open("MileageDB", 1);
    req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("entries")) {
            const store = d.createObjectStore("entries", { keyPath: "id", autoIncrement: true });
            store.createIndex("user", "user", { unique: false });
        }
    };
    req.onsuccess = e => { db = e.target.result; callback(); };
    req.onerror = () => alert("Could not open database.");
}

// ── Date helpers ───────────────────────────────────────
function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

// ── Tax year helpers ───────────────────────────────────
function getTaxYearKey(dateStr) {
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const taxYearStart = new Date(year, 3, 6);
    if (d >= taxYearStart) {
        return `${year}_${String(year + 1).slice(-2)}`;
    } else {
        return `${year - 1}_${String(year).slice(-2)}`;
    }
}
function getTaxYearLabel(key) {
    const [start, end] = key.split("_");
    return `${start}-${end}`;
}

// ── Profile screen ─────────────────────────────────────
function showProfileScreen() {
    document.getElementById("profileScreen").style.display = "flex";
    document.getElementById("appScreen").style.display = "none";
    document.getElementById("switchUserBtn").style.display = "none";
    document.getElementById("currentUserBadge").textContent = "";
    renderProfileList();
}

function renderProfileList() {
    const profiles = getProfiles();
    const list = document.getElementById("profileList");
    list.innerHTML = "";
    profiles.forEach(name => {
        const btn = document.createElement("button");
        btn.className = "profile-btn";
        btn.textContent = name;
        btn.onclick = () => selectUser(name);
        list.appendChild(btn);
    });
}

document.getElementById("addProfileBtn").onclick = () => {
    const input = document.getElementById("newProfileName");
    const name = input.value.trim();
    if (!name) return;
    const profiles = getProfiles();
    if (profiles.map(p => p.toLowerCase()).includes(name.toLowerCase())) {
        alert("That name already exists.");
        return;
    }
    profiles.push(name);
    saveProfiles(profiles);
    input.value = "";
    selectUser(name);
};

document.getElementById("newProfileName").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("addProfileBtn").click();
});

function selectUser(name) {
    currentUser = name;
    setLastUser(name);
    document.getElementById("currentUserBadge").textContent = name;
    document.getElementById("switchUserBtn").style.display = "block";
    document.getElementById("profileScreen").style.display = "none";
    document.getElementById("appScreen").style.display = "block";
    document.getElementById("date").value = getTodayString();
    loadEntries();
}

document.getElementById("switchUserBtn").onclick = () => {
    currentUser = null;
    showProfileScreen();
};

// ── Add journey ────────────────────────────────────────
document.getElementById("add").onclick = () => {
    const date     = document.getElementById("date").value;
    const from     = document.getElementById("from").value.trim();
    const to       = document.getElementById("to").value.trim();
    const purpose  = document.getElementById("purpose").value.trim();
    const miles    = parseFloat(document.getElementById("miles").value);
    const vehicle  = document.getElementById("vehicle").value.trim();
    const rate     = parseFloat(document.getElementById("rate").value);

    if (!date || !from || !to || !purpose || !vehicle || isNaN(miles) || isNaN(rate)) {
        alert("Please complete all fields.");
        return;
    }

    const entry = { user: currentUser, date, from, to, purpose, miles, vehicle, rate, amount: miles * rate };
    const tx = db.transaction("entries", "readwrite");
    tx.objectStore("entries").add(entry);
    tx.oncomplete = () => { loadEntries(); clearForm(); };
};

function clearForm() {
    document.getElementById("date").value = getTodayString();
    ["from","to","purpose","miles","vehicle"].forEach(id => {
        document.getElementById(id).value = "";
    });
}

// ── Load & render entries ──────────────────────────────
function loadEntries() {
    const tx = db.transaction("entries", "readonly");
    const index = tx.objectStore("entries").index("user");
    const req = index.getAll(currentUser);
    req.onsuccess = () => {
        entriesCache = req.result;
        renderTable(entriesCache);
        populateTaxYearSelect(entriesCache);
    };
}

function renderTable(entries) {
    const tbody = document.querySelector("#logTable tbody");
    tbody.innerHTML = "";
    const sorted = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
    sorted.forEach(e => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${e.date}</td>
            <td>${e.from}</td>
            <td>${e.to}</td>
            <td>${e.miles.toFixed(1)}</td>
            <td>£${e.amount.toFixed(2)}</td>
        `;
        tbody.appendChild(row);
    });
}

function populateTaxYearSelect(entries) {
    const select = document.getElementById("taxYearSelect");
    const keys = Array.from(new Set(entries.map(e => getTaxYearKey(e.date)))).sort();
    select.innerHTML = "";
    keys.forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = getTaxYearLabel(key);
        select.appendChild(opt);
    });
}

// ── Export CSV ─────────────────────────────────────────
document.getElementById("exportYear").onclick = () => {
    const key = document.getElementById("taxYearSelect").value;
    if (!key) { alert("No tax year selected."); return; }
    const rows = entriesCache.filter(e => getTaxYearKey(e.date) === key);
    if (!rows.length) { alert("No entries for that tax year."); return; }
    const csv = generateCSV(rows);
    const fileName = `Mileage_${currentUser.replace(/\s+/g,"_")}_${key}.csv`;
    downloadCSV(csv, fileName);
};

function generateCSV(entries) {
    let csv = "Date,From,To,Purpose,Miles,Vehicle,Rate,Amount\n";
    entries.forEach(e => {
        const esc = s => `"${String(s).replace(/"/g,'""')}"`;
        csv += `${e.date},${esc(e.from)},${esc(e.to)},${esc(e.purpose)},${e.miles},${esc(e.vehicle)},${e.rate},${e.amount}\n`;
    });
    return csv;
}

function downloadCSV(csv, fileName) {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS && navigator.share) {
        const file = new File([new Blob([csv], { type: "text/csv" })], fileName, { type: "text/csv" });
        navigator.share({ files: [file], title: fileName })
            .catch(() => iosDataURIFallback(csv, fileName));
    } else {
        const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        const a = Object.assign(document.createElement("a"), { href: url, download: fileName });
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
}

function iosDataURIFallback(csv, fileName) {
    const a = Object.assign(document.createElement("a"), {
        href: "data:text/csv;charset=utf-8," + encodeURIComponent(csv),
        download: fileName
    });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// ── Boot ───────────────────────────────────────────────
openDB(() => {
    const last = getLastUser();
    const profiles = getProfiles();
    if (last && profiles.includes(last)) {
        selectUser(last);
    } else {
        showProfileScreen();
    }
});
</script>
</body>
</html>
