<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Mileage</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    margin: 0;
    background: #f5f7fa;
    color: #222;
}
header {
    background: #0078d4;
    color: white;
    padding: 16px;
    text-align: center;
}
h1, h2 {
    margin: 0 0 12px 0;
}
.card {
    background: white;
    margin: 16px;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
label {
    margin-top: 12px;
    display: block;
    font-weight: 600;
    font-size: 14px;
}
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
}
button.primary {
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    background: #0078d4;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}
button.primary:active {
    opacity: 0.8;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
td, th {
    padding: 8px;
    border-bottom: 1px solid #eee;
    text-align: left;
}
footer {
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: #666;
}
</style>
</head>

<body>
<header>
    <h1>Business Mileage</h1>
</header>

<section class="card">
    <h2>Add journey</h2>

    <label>Date</label>
    <input type="date" id="date">

    <label>From</label>
    <input type="text" id="from">

    <label>To</label>
    <input type="text" id="to">

    <label>Business purpose</label>
    <input type="text" id="purpose">

    <label>Miles</label>
    <input type="number" id="miles" step="0.1">

    <label>Vehicle registration</label>
    <input type="text" id="vehicle">

    <label>Rate (£/mile)</label>
    <input type="number" id="rate" step="0.01" value="0.45">

    <button id="add" class="primary">Add journey</button>
</section>

<section class="card">
    <h2>Journeys</h2>
    <table id="logTable">
        <thead>
        <tr>
            <th>Date</th>
            <th>From</th>
            <th>To</th>
            <th>Miles</th>
            <th>Amount</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<section class="card">
    <h2>Export</h2>
    <p>Select a tax year and export a CSV.</p>
    <label>Tax year</label>
    <select id="taxYearSelect"></select>
    <button id="exportYear" class="primary">Export selected tax year CSV</button>
</section>

<footer>
    <small>Data stored locally on this device.</small>
</footer>

<script>
// IndexedDB setup
let db;
let entriesCache = [];

const request = indexedDB.open("MileageDB", 1);
request.onupgradeneeded = e => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("entries")) {
        db.createObjectStore("entries", { keyPath: "id", autoIncrement: true });
    }
};
request.onsuccess = e => {
    db = e.target.result;
    loadEntries();
};

// Pre-fill today's date
function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}
document.getElementById("date").value = getTodayString();

// Tax year helpers
function getTaxYearKey(dateStr) {
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const taxYearStart = new Date(year, 3, 6); // 6 April
    if (d >= taxYearStart) {
        const next = year + 1;
        return `${year}_${String(next).slice(-2)}`;
    } else {
        const prev = year - 1;
        return `${prev}_${String(year).slice(-2)}`;
    }
}
function getTaxYearLabelFromKey(key) {
    const [start, end] = key.split("_");
    return `${start}-${end}`;
}

// Add entry
document.getElementById("add").onclick = () => {
    const date = document.getElementById("date").value;
    const from = document.getElementById("from").value.trim();
    const to = document.getElementById("to").value.trim();
    const purpose = document.getElementById("purpose").value.trim();
    const miles = parseFloat(document.getElementById("miles").value);
    const vehicle = document.getElementById("vehicle").value.trim();
    const rate = parseFloat(document.getElementById("rate").value);

    if (!date || !from || !to || !purpose || !vehicle || isNaN(miles) || isNaN(rate)) {
        alert("Please complete all fields.");
        return;
    }

    const amount = miles * rate;
    const entry = { date, from, to, purpose, miles, vehicle, rate, amount };

    const tx = db.transaction("entries", "readwrite");
    tx.objectStore("entries").add(entry);
    tx.oncomplete = () => {
        loadEntries();
        clearForm();
    };
};

function clearForm() {
    document.getElementById("date").value = getTodayString(); // reset to today
    document.getElementById("from").value = "";
    document.getElementById("to").value = "";
    document.getElementById("purpose").value = "";
    document.getElementById("miles").value = "";
    document.getElementById("vehicle").value = "";
}

// Load entries
function loadEntries() {
    const tx = db.transaction("entries", "readonly");
    const store = tx.objectStore("entries");
    const req = store.getAll();
    req.onsuccess = () => {
        entriesCache = req.result;
        renderTable(entriesCache);
        populateTaxYearSelect(entriesCache);
    };
}

// Render table
function renderTable(entries) {
    const tbody = document.querySelector("#logTable tbody");
    tbody.innerHTML = "";
    const sorted = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));

    sorted.forEach(e => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${e.date}</td>
            <td>${e.from}</td>
            <td>${e.to}</td>
            <td>${e.miles.toFixed(1)}</td>
            <td>£${e.amount.toFixed(2)}</td>
        `;
        tbody.appendChild(row);
    });
}

// Populate tax year dropdown
function populateTaxYearSelect(entries) {
    const select = document.getElementById("taxYearSelect");
    const years = new Set(entries.map(e => getTaxYearKey(e.date)));
    const sortedKeys = Array.from(years).sort();

    select.innerHTML = "";
    sortedKeys.forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = getTaxYearLabelFromKey(key);
        select.appendChild(opt);
    });
}

// CSV generation
function generateCSV(entries) {
    let csv = "Date,From,To,Purpose,Miles,Vehicle,Rate,Amount\n";
    entries.forEach(e => {
        csv += `${e.date},"${e.from.replace(/"/g, '""')}","${e.to.replace(/"/g, '""')}","${e.purpose.replace(/"/g, '""')}",${e.miles},${e.vehicle},${e.rate},${e.amount}\n`;
    });
    return csv;
}

// Export CSV — iOS Safari compatible
document.getElementById("exportYear").onclick = () => {
    const select = document.getElementById("taxYearSelect");
    const key = select.value;
    if (!key) {
        alert("No tax year selected.");
        return;
    }
    const entriesForYear = entriesCache.filter(e => getTaxYearKey(e.date) === key);
    if (!entriesForYear.length) {
        alert("No entries for that tax year.");
        return;
    }
    const csv = generateCSV(entriesForYear);
    const fileName = `Mileage_${key}.csv`;
    downloadCSV(csv, fileName);
};

function downloadCSV(csv, fileName) {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isIOS && navigator.share) {
        // iOS: use Web Share API so the user can save to Files, email, etc.
        const blob = new Blob([csv], { type: "text/csv" });
        const file = new File([blob], fileName, { type: "text/csv" });
        navigator.share({
            files: [file],
            title: fileName,
        }).catch(err => {
            // User cancelled or share failed — fall back to data URI
            iosDataURIFallback(csv, fileName);
        });
    } else {
        // Desktop / non-iOS: standard blob download
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
}

// Fallback for older iOS without navigator.share file support
function iosDataURIFallback(csv, fileName) {
    const encoded = encodeURIComponent(csv);
    const dataUri = "data:text/csv;charset=utf-8," + encoded;
    const a = document.createElement("a");
    a.href = dataUri;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>

</body>
</html>
